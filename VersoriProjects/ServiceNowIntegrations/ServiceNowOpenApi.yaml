  /api/now/ppm/insert_project_tasks:
    post:
      summary: Insert Project Tasks
      description: Endpoint to insert tasks of a project 
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                start_date:
                  type: string
                  description: Start date and time in the format "YYYY-MM-DD HH:mm:ss"
                end_date:
                  type: string
                  description: End date and time in the format "YYYY-MM-DD HH:mm:ss"
                short_description:
                  type: string
                  description: Short description of the project
                external_id:
                  type: string
                  description: External ID of the project
                child_tasks:
                  type: array
                  items:
                    type: object
                    properties:
                      short_description:
                        type: string
                        description: Short description of the task
                      external_id:
                        type: string
                        description: External ID of the task
                      child_tasks:
                        type: array
                        items:
                          type: object
                          properties:
                            external_id:
                              type: string
                              description: External ID of the child task
                            short_description:
                              type: string
                              description: Short description of the child task
                          required:
                            - external_id
                            - short_description
                      dependencies:
                        type: array
                        items:
                          type: object
                          properties:
                            external_id:
                              type: string
                              description: External ID of the dependent task
                            lag:
                              type: integer
                              description: Lag time for the dependency
                            type:
                              type: string
                              description: Type of dependency (e.g., "fs" for Finish to Start)
                          required:
                            - external_id
                            - lag
                            - type
                  required:
                    - short_description
                    - external_id
              required:
                - start_date
                - end_date
                - short_description
                - external_id
      responses:
        '200':
          description: Successful response
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error
      security:
        - basicAuth: []



components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
