  /api/now/table/{tableName}/{sys_id}:
    put:
      summary: Update the specified record in the table
      security:
        - basicAuth: []
      description: >
        Updates the specified record with the request body.
      parameters:
        - name: tableName
          in: path
          required: true
          description: Name of the table where the record is located
          schema:
            type: string
        - name: sys_id
          in: path
          required: true
          description: Unique identifier of the record to update
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name-value pairs:
                  type: object
                  description: Name-value pairs for the field(s) to update in the associated table
      responses:
        '200':
          description: Successful. The request was successfully processed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name-value pairs:
                    type: object
                    description: All fields (not just modified) with their associated values for the change request

    patch:
      summary: Update record in the specified table
      description: Updates the specified record with the name-value pairs included in the request body.
      security:
        - basicAuth: []
      parameters:
        - name: tableName
          in: path
          required: true
          description: Name of the table to update the record
          schema:
            type: string
        - name: sys_id
          in: path
          required: true
          description: Sys_id of the record to update
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
                description: Dynamic properties for updating the record
            example:
              property1: 'value1'
              property2: 'value2'
              property3: 'value3'
      responses:
        '200':
          description: Successful update

