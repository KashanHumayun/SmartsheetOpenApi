  /api/now/table/{tableName}:
    post:
      summary: Insert a record in the specified table
      description: >
        Inserts one record in the specified table. Multiple record insertion is not supported by this method.
      parameters:
        - name: tableName
          in: path
          required: true
          description: Name of the table to insert the record
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                active:
                  type: boolean
                  description: Whether the project is active or not.
                risk:
                  type: string
                  description: The risk level of the project.
                number:
                  type: string
                  description: The project number.
                project_dashboard:
                  type: object
                  properties:
                    link:
                      type: string
                      format: uri
                      description: The link to the project dashboard.
                    value:
                      type: string
                      description: The value of the project dashboard.
                  description: Information about the project dashboard.
                phase:
                  type: string
                  description: The current phase of the project.
                client:
                  type: string
                  description: The client associated with the project.
                sales_rep:
                  type: string
                  description: The sales representative for the project.
                closed_at:
                  type: string
                  format: date
                  description: The date when the project was closed.
                short_description:
                  type: string
                  description: A short description of the project.
                approval:
                  type: string
                  description: The approval status of the project.
                start_date:
                  type: string
                  format: date
                  description: The start date of the project.
                end_date:
                  type: string
                  format: date
                  description: The end date of the project.
                project_type:
                  type: string
                  description: The type of the project.
                resource_allocated_cost:
                  type: string
                  format: float
                  description: The allocated cost for resources in the project.
                time_worked:
                  type: string
                  format: float
                  description: The time worked on the project.
                remaining_duration:
                  type: string
                  format: float
                  description: The remaining duration of the project.
                budget_cost_project_currency:
                  type: object
                  properties:
                    link:
                      type: string
                      format: uri
                      description: The link to the budget cost in project currency.
                    value:
                      type: string
                      description: The value of the budget cost in project currency.
                  description: Information about the budget cost in project currency.
                assigned_to:
                  type: string
                  description: The person assigned to the project.
                manager:
                  type: string
                  description: The manager of the project.
      responses:
        '200':
          description: Indicates that the request completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    description: Field names and values of all parameters within the newly created record or those specified in the query parameters
                    properties:
                      sys_id:
                        type: string
