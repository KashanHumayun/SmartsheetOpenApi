                type: object
              example:
                token: >-
                  eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJER0YtVFIgZUNTIEFQSSBEb2N1bWVudGF0aW9uIiwiZXhwIjoxNjQ2MTM2MjU3LCJuYmYiOjE2NDYxMzIzNTcsImlhdCI6MTY0NjEzMjY1Nywicm9sZXMiOiIiLCJ1c2VybmFtZSI6Im5hdmx1bmdvIn0.maYJJvyMsvBkxK96kpjed8mWitmoTRi9OChgg3oIT2pW-30vo0gRdjqxNMJMVoPJ7VCBfpQACmNIEvcY0jC8BA
        '401':
