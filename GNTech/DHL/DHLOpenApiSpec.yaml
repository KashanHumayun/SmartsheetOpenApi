        ## Use this API for any product pickup request.


        > The information you need to create a pickup request is: `refNo`


        ## Request Description


        HTTP Method: GET


        URL Path: /api/v1/shipment/


        This HTTP method has no request body.


        ## Response Description


        > M- Mandatory O- Optional C- Conditional N- Not Applicable


        | Node | Data Type | Required | Description | Example Values |

        | --- | --- | --- | --- | --- |

        | **`shipmentId`** | string | C | Generated by DHL, present always and
        only in valid 200 responses. | JJD149990299999363768 |

        | **`refNo`** | string | M | DHL shipment reference number. | A1512315 |

        | **`eCommerce`** | boolean | C | Commercial transactions conducted on
        the internet. | false |

        | **`shipperName`** | string | M | Shipper name. | Cahit Tosyalı |

        | **`shipperAddress`** | string | M | Shipper address string. | 75\. yıl
        mah. Gündoğdu san. sit. |

        | **`shipperPostalCode`** | string | M | The pickup postal code required
        for delivery of the shipment. | 26250 |

        | **`shipperDistrict`** | string | M | The shipper district required for
        delivery of the shipment. | Merkez |

        | **`shipperCity`** | string | M | The pickup city where the shipment
        will be picked up for delivery. | Istanbul |

        | **`shipperCountry`** | string | M | The pickup country where the
        shipment will be picked up for delivery. | TR |

        | **`shipperTaxId`** | string | M | Shipper tax number. | 50897174745 |

        | **`shipperPhone`** | integer | O | The shipment contact number should
        there be any need to talk pickup logistics. | 02126785845 |

        | **`shipperEMail`** | string | O | Return contact email address. |
        [cahit.tosyali@dhl.com](mailto:cahit.tosyali@dhl.com) |

        | **`consigneeName`** | string | M | Consignee name. | Richard Zwieg |

        | **`consigneeAddress`** | string | M | Consignee address string. |
        Trilluper Weg 70b |

        | **`consigneePostalCode`** | string | M | The consignee postal code
        required for delivery of the shipment. | 22397 |

        | **`consigneeDistrict`** | string | M | The consignee district required
        for delivery of the shipment. | Hamburg |

        | **`consigneeCity`** | string | M | The city required for delivery of
        the shipment. | Hamburg |

        | **`consigneeCountry`** | string | M | The country where the shipment
        will be delivered to the consignee. | DE |

        | **`consigneePhone`** | string | O | The consignee phone number. |  |

        | **`consigneeEMail`** | string | O | The e-mail address of the
        recipient who will receive the product. |
        [richard.zweig@gmail.com](mailto:richard.zweig@gmail.com) |

        | **`packageType`** | string | O | Specify the type of package. | BI |

        | **`packageCount`** | integer | O | Total number of package in a
        shipment. | 1 |

        | **`deliveryPlace`** | string | M | The place where the product will be
        delivered. | trilluper Weg 10b |

        | **`invoiceNumber`** | string | O | Invoice number issued for the
        product to be delivered. |  |

        | **`invoiceCurrency`** | string | O | The currency type specified on
        the invoice. | USD |

        | **`freightAmount`** | float | O | Total freight amount. | 2.61 |

        | **`freightCurrency`** | string | O | The currency type specified on
        the freight. | EUR |

        | **`insuranceAmount`** | integer | O | The total amount of insurance
        paid for the shipment. | 0 |

        | **`insuranceCurrency`** | string | O | The currency type specified on
        the insurance. |  |
