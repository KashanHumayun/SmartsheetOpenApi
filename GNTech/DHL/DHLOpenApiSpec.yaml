openapi: 3.0.0
info:
  title: DHL eCommerce Solutions TR API
  description: >-
    The DHL Developer Portal is DPDHL\`s point of contact for access to APIs
    from all its business divisions, allowing to signing up for them and making
    them easy to consume.


    BY accessing and using the DHL eCommerce Solutions TR API, you indicate that
    you accept the legal terms of use. If you do not accept these legal terms,
    you or the entity you are authorized to represent should not use the site.


    The DHL eCOMMERCE Solutions TR API is your one solution to get shipping
    products, generating shipping labels, tracking packages.


    This documentation provides detailed information about the API structure and
    its use. Check the API Catalog to see the first APIs already released on
    this portal.


    ![](https://i.ibb.co/gS4fPwZ/apitasar-m.png)


    **The API can be used for:**


    Only DHL packages originating within Turkey and international packages.


    All DHL eCommerce Solutions TR shipping products


    This documentation provides detailed information about the API its use. You
    can also go directly to the following topics:


    *   [Auth
    API](https://docs.api.dgftrack.com/#9418f345-142b-4563-bce7-6acba1757b13)

    *   [Shipment
    API](https://docs.api.dgftrack.com/#4af5944e-75ac-46fa-b534-ff71376fa2af)

    *   [Tracking
    API](https://docs.api.dgftrack.com/#479fa71b-4e1f-4884-93f8-6fb3162d297e)

    *   [Label
    API](https://docs.api.dgftrack.com/#fcc20cdc-a368-455f-a1de-110e7cba9237)
        

    **Using The API**


    The API has been designed for use by developers. You will need basic
    knowledge of REST APIs, JSON and HTTPS. In addition, your organization must
    have a customer account with DHL eCommerce Solutions Turkey.


    **Example Use Cases**


    Simply integrate into your existing website or solution.


    Easy integration into any eCommerce platform such as your Order Management
    System, Transportation Management System or an eCommerce website.


    Sellers can use the API to get access to DHL eCommerce TR portfolio
    solution.


    Third-party vendors and shipping aggregators can use the API to provide
    their customers with access to DHL eCommerce shipping solutions.
  version: 1.0.0
servers:
  - url: http://{{host}}
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
tags:
  - name: User Guide
    description: >-
      #### Using this guide, you can learn how to:


      *   [Use the Authorization endpoint to get an access
      token](https://docs.api.dgftrack.com/#9418f345-142b-4563-bce7-6acba1757b13)

      *   [Request a shipment
      pickup](https://docs.api.dgftrack.com/#4af5944e-75ac-46fa-b534-ff71376fa2af)

      *   [Track single or multiple
      packages](https://docs.api.dgftrack.com/#479fa71b-4e1f-4884-93f8-6fb3162d297e)

      *   [Create and download shipping labels in multiple supported
      formats](https://docs.api.dgftrack.com/#fcc20cdc-a368-455f-a1de-110e7cba9237)
  - name: User Guide > Postman Collection
    description: >-
      Postman is a collaboration platform that allows for API development and
      you to easily test your APIs without the need long code. It is also a tool
      that helps you prepare API documentation.


      You can download Postman [here](https://www.postman.com/downloads/).


      Click on "Run in Postman" button at the top of the page and select Postman
      for Windows if you're running a Windows PC. This will open Postman and
      download the complete collection under the name "DHL eCommerce Solutions
      TR API".


      This collection contains the [collection
      variables](https://learning.getpostman.com/docs/postman/environments-and-globals/variables/#defining-collection-variables-via-the-ui)
      `username` and `password`. Set these variables to values received from the
      implementations team so you can send API requests and get the results of
      the requests you send.


      Also, the implementation team can provide you a different pickup number
      for testing. In this case you need to replace the 'pickup' collection
      variable.


      > See below for visual.


      ![](https://media.giphy.com/media/VD4hNAwy7zWnSoAyGh/giphy.gif)


      In addition, this collection provides visualization of most of most API
      responses. The image below was created using the API Visualization feature
      in Postman.


      ![](https://i.ibb.co/rMnNs6X/testlabel1.png)
  - name: Auth
    description: >-
      # **Authorization**


      An authentication is required to access any of DHL eCommerce API
      resources. The following section will guide you through the process of
      using this service for an authentication process.


      ## Scope


      The following operations are allowed in the Authentication API:


      | Operation | Path | Type | Description | Availability |

      | --- | --- | --- | --- | --- |

      | Authentication | /api/v1/login | GET | Verify client credentials. | All
      customers |


      ## Important


      An authentication token is valid for a certain amount of time before it
      expires. This limit is currently set to 60 minutes. When it expires, the
      requested resource will throw the following error: 'Access token expired'.


      ## Workflow


      *   The following fields needs to be sent as form parameters - `user_name`
      , `password`

      *   Sending the request will return an `token` in the response
          

      The token is a `Bearer` token hence it must be sent with every resource
      request using the `Authorization` header. The word `Bearer` preprended to
      the token itself and separated by a space.


      ## Request


      #### Here is a sample request


      ```

      GET /api/v1/login HTTP/1.1

      Host: portal.dgftrack.com/DGFTR_eCS_API.dll

      Content-Type: application/x-www-form-urlencoded

      grant_type = client_credentials


      ```


      > The request contains a field named `grant_type` with a value of
      `client_credentials`. The grant_type is sent in the body with the
      Content-Type of application/x-www-form-urlencoded. This is mandatory for
      successful authentication and obtaining `token`.


      ## Response


      | Node | Data Type | Description |

      | --- | --- | --- |

      | token | string | Authentication token. Keep this value for resource
      accesses. |


      #### Here is a sample good response


      ```

      {
          "token": "eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJER0YtVFIgZUNTIEFQSSBEb2N1bWVudGF0aW9uIiwiZXhwIjoxNjQ1Njg4NzY0LCJuYmYiOjE2NDU2ODQ4NjQsImlhdCI6MTY0NTY4NTE2NCwicm9sZXMiOiIiLCJ1c2VybmFtZSI6Im5hdmx1bmdvIn0.94d5VOTdgTLvY__BAxNg3qtY4xG2MPUqDfTJLQ15lDfa-l2Hqk4Jsz6q7CNJypO0170vWtGXbaopdZ-Uzfnerg"
      }


      ```


      #### Here is a sample bad response


      ```

      DGF-TR eCS API Gateway

      HTTP 401: [EMVCJWTException] Username and password required


      ```
  - name: Shipment
    description: >-
      This API is used to create a shipment pickup request for one or more
      products.


      ## Scope


      The following operations are allowed in the Shipment API:


      | Operation | Type | Path |

      | --- | --- | --- |

      | Get pickup request | GET | /api/v1/shipment/`refNo` |

      | Create pickup request | POST | /api/v1/shipment |

      | Cancel pickup request | DELETE | /api/v1/shipment/`refNo` |


      ## Important


      This API can be used to create a shipment request. The response will
      assign a range based on availability.


      Each pickup request is assigned a unique `refNo` which can be used to view
      the pickup information and delete an existing pickup.
  - name: Tracking
    description: >-
      This API is used to check the latest tracking status of any domestic or
      international package.


      ## Scope


      The following operations are allowed in the Tracking API:


      | Operation | Type | Path |

      | --- | --- | --- |

      | Get Tracking | GET | /api/v1/shipment/track/`refNo` |


      ## Important


      All tracking requests should be authorized for the pick up. This means
      that the tracking results will be returned only if the requested package
      is exist at least one of the authorized pick up for the API user.


      We recommend that you track a package using the `refNo`.
  - name: Label
    description: >-
      Now that you are authorized, you can start using the label endpoints that
      can create local and international label.


      ## Scope


      The following operations are allowed in the Label API:


      | Operation | Type | Path |

      | --- | --- | --- |

      | Get Label | GET | /api/v1/shipment/label/`refNo` |


      ## Important


      Each Label API request is used to create a single shipping label.


      > Each label has a unique reference number called ref no. For every
      successful label that is created, the response will contain the
      `shipmentId`.


      After generating a label, a package will have the following identifiers
      used so it can be tracked:


      *   `shipmentId`: DHL-generated shipment Id.

      *   `refNo`: DHL shipment reference number.
