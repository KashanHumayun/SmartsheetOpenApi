                                    variation_id:
                                      type: integer
                                    quantity:
                                      type: integer
                                    tax_class:
                                      type: string
                                    subtotal:
                                      type: string
                                    subtotal_tax:
                                      type: string
                                    total:
                                      type: string
                                    total_tax:
                                      type: string
                                    sku:
                                      type: string
                                    price:
                                      type: integer
                                    meta_data:
                                      type: array
                                      items:
                                        type: object
                                        properties:
                                          id:
                                            type: integer
                                          key:
                                            type: string
                                          value:
                                            type: string
                              tax_lines:
                                type: array
                                items: {}
                              shipping_lines:
                                type: array
                                items: {}
                              fee_lines:
                                type: array
                                items: {}
                              coupon_lines:
                                type: array
                                items: {}
                              refunds:
                                type: array
                                items: {}
                              _links:
                                type: object
                                properties:
                                  self:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        href:
                                          type: string
                                  collection:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        href:
                                          type: string
                                  customer:
                                    type: array
                                    items:
                                      type: object
                                      properties:
