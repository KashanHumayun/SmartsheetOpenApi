                                  state:
                                    type: string
                                  postcode:
                                    type: string
                                  country:
                                    type: string
                                  email:
                                    type: string
                                    format: email
                                  phone:
                                    type: string
                              shipping:
                                type: object
                                properties:
                                  first_name:
                                    type: string
                                  last_name:
                                    type: string
                                  company:
                                    type: string
                                  address_1:
                                    type: string
                                  address_2:
