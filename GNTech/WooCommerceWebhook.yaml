                                type: string
                              transaction_id:
                                type: string
                              date_paid:
                                type: string
                                format: date-time
                              date_paid_gmt:
                                type: string
                                format: date-time
                              date_completed:
                                type: string
                                format: date-time
                              date_completed_gmt:
                                type: string
                                format: date-time
                              cart_hash:
                                type: string
                              meta_data:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id:
                                      type: integer
                                    key:
                                      type: string
                                    value:
                                      type: string
                              line_items:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id:
                                      type: integer
